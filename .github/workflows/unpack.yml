name: Unpack
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: zip খুলে ফাইল বসানো
        run: |
          unzip -q niharika.zip
          rm -rf niharika/.github
          cp -r niharika/. .
          rm -rf niharika niharika.zip
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "Add Niharika v2"
          git push
